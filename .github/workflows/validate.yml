name: validate-example
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/bootstrap.py
      - run: python scripts/validate_candidates.py --input examples/candidate_batch.example.json --output /tmp/accepted.json --report /tmp/report.json
