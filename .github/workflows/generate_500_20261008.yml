name: generate-500-20261008

on:
  push:
    paths:
      - scripts/generate_500_20261008.py
      - .github/workflows/generate_500_20261008.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run repository self-test
        run: python scripts/selftest.py
      - name: Generate and validate 500-factor batch
        run: python scripts/generate_500_20261008.py
      - name: Revalidate final handoff with stock validator
        run: |
          python scripts/validate_candidates.py             --input ready_for_factors_lab_20261008_500.json             --output /tmp/revalidated.json             --report /tmp/revalidated_report.json
          python - <<'PY'
          import json
          a=json.load(open('ready_for_factors_lab_20261008_500.json',encoding='utf-8'))
          b=json.load(open('/tmp/revalidated.json',encoding='utf-8'))
          r=json.load(open('/tmp/revalidated_report.json',encoding='utf-8'))
          assert a == b, 'revalidated output differs from generated output'
          assert r['accepted_count'] == 500
          assert r['rejected_count'] == 0
          assert r['warning_count'] == 0
          print({k:r[k] for k in ('accepted_count','rejected_count','warning_count','mother_bank_factor_count')})
          PY
      - name: Commit validated outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             ready_for_factors_lab_20261008_500.json             mother_bank/added_20261008_500.json             audit_20261008_500.json             campaign_20261008_500_selection.json
          git commit -m "add validated diversified 500-factor batch"
          git push
